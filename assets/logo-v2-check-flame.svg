<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <!-- PaidUp Logo V2: Checkmark with Flame Trail -->
  <!-- Concept: "Done" energy — a bold checkmark that trails fire -->
  <defs>
    <linearGradient id="trailGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="checkGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <rect width="400" height="100" rx="12" fill="#0a0e1a"/>
  
  <!-- Logomark: Flaming checkmark -->
  <g transform="translate(18, 12)">
    <!-- Fire trail behind checkmark -->
    <path d="M15 52 C12 48, 8 40, 12 32 C14 28, 18 30, 18 25 C18 20, 22 16, 26 18 C28 14, 30 16, 28 22" 
          stroke="#f59e0b" stroke-width="3" fill="none" opacity="0.5" stroke-linecap="round"/>
    <path d="M52 20 C56 14, 58 8, 62 12 C66 8, 68 14, 64 20 C68 16, 72 10, 70 18" 
          stroke="#f59e0b" stroke-width="2.5" fill="none" opacity="0.4" stroke-linecap="round"/>
    
    <!-- Bold checkmark -->
    <polyline points="14,42 30,62 66,18" 
             stroke="url(#checkGrad2)" stroke-width="9" fill="none" 
             stroke-linecap="round" stroke-linejoin="round" filter="url(#glow2)"/>
    
    <!-- Small flame accents -->
    <circle cx="14" cy="42" r="4" fill="#f59e0b" opacity="0.6"/>
    <circle cx="66" cy="18" r="5" fill="#f59e0b" opacity="0.7"/>
    <circle cx="68" cy="15" r="3" fill="#f59e0b" opacity="0.4"/>
  </g>
  
  <!-- Wordmark -->
  <text x="105" y="60" font-family="'Inter', 'SF Pro Display', -apple-system, system-ui, sans-serif" font-size="44" font-weight="900" letter-spacing="-1.5">
    <tspan fill="#ffffff">Paid</tspan><tspan fill="#10b981">Up</tspan>
  </text>
  
  <!-- Subtle underline accent -->
  <line x1="105" y1="68" x2="172" y2="68" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  
  <!-- Tagline -->
  <text x="105" y="82" font-family="'Inter', 'SF Pro Display', -apple-system, system-ui, sans-serif" font-size="11" font-weight="400" fill="#6b7280" letter-spacing="0.5">
    Never chase an invoice again.
  </text>
</svg>