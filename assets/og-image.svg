<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- PaidUp OG Image — 1200x630 for social sharing -->
  <defs>
    <linearGradient id="ogCheck" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="ogGlow" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0a0e1a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.08"/>
      <stop offset="70%" stop-color="#0a0e1a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0e1a"/>
  <rect width="1200" height="630" fill="url(#centerGlow)"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.03" stroke="#3b82f6" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="630"/><line x1="60" y1="0" x2="60" y2="630"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="180" y1="0" x2="180" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/><line x1="420" y1="0" x2="420" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="540" y1="0" x2="540" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="660" y1="0" x2="660" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="780" y1="0" x2="780" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/><line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/><line x1="1020" y1="0" x2="1020" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/><line x1="1140" y1="0" x2="1140" y2="630"/>
    <line x1="0" y1="60" x2="1200" y2="60"/><line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="420" x2="1200" y2="420"/><line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
  </g>
  
  <!-- Checkmark logomark — large -->
  <g transform="translate(240, 160)">
    <!-- Flame accents -->
    <circle cx="18" cy="108" r="10" fill="#f59e0b" opacity="0.4"/>
    <circle cx="190" cy="20" r="14" fill="#f59e0b" opacity="0.5"/>
    <circle cx="200" cy="10" r="8" fill="#f59e0b" opacity="0.3"/>
    
    <!-- Bold checkmark -->
    <polyline points="20,110 90,200 200,30" 
             stroke="url(#ogCheck)" stroke-width="28" fill="none" 
             stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Wordmark — centered -->
  <text x="600" y="340" text-anchor="middle" font-family="'Inter', 'SF Pro Display', -apple-system, system-ui, sans-serif" font-size="120" font-weight="900" letter-spacing="-4">
    <tspan fill="#ffffff">Paid</tspan><tspan fill="#10b981">Up</tspan>
  </text>
  
  <!-- Orange accent underline -->
  <line x1="380" y1="360" x2="530" y2="360" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  
  <!-- Tagline -->
  <text x="600" y="420" text-anchor="middle" font-family="'Inter', 'SF Pro Display', -apple-system, system-ui, sans-serif" font-size="32" font-weight="400" fill="#9ca3af" letter-spacing="1">
    Never chase an invoice again.
  </text>
  
  <!-- URL -->
  <text x="600" y="580" text-anchor="middle" font-family="'Inter', 'SF Pro Display', -apple-system, system-ui, sans-serif" font-size="20" font-weight="500" fill="#6b7280" letter-spacing="2">
    paidup.dev
  </text>
</svg>