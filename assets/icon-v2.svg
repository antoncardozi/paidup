<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- PaidUp Favicon/App Icon — Flaming Checkmark (V2 derivative) -->
  <defs>
    <linearGradient id="iconCheck" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0a0e1a"/>
  
  <!-- Flame accents -->
  <circle cx="12" cy="36" r="3" fill="#f59e0b" opacity="0.5"/>
  <circle cx="52" cy="14" r="4" fill="#f59e0b" opacity="0.6"/>
  <circle cx="55" cy="11" r="2.5" fill="#f59e0b" opacity="0.35"/>
  
  <!-- Bold checkmark -->
  <polyline points="14,34 26,50 52,16" 
           stroke="url(#iconCheck)" stroke-width="8" fill="none" 
           stroke-linecap="round" stroke-linejoin="round"/>
</svg>